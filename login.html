<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Admin login | PSM InternHub</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #1e1b4b; background: #ffffff; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; background: linear-gradient(135deg, #f5f3ff 0%, #ffffff 50%, #ede9fe 100%); }
    main { width: min(100%, 400px); border: 1px solid #e9d5ff; border-radius: 16px; background: white; padding: 32px; box-shadow: 0 18px 48px rgba(124, 58, 237, 0.08); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
    .mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 12px; background: transparent; color: white; font-size: 12px; font-weight: 800; }
    .brand-name { font-size: 17px; font-weight: 800; letter-spacing: -.04em; }
    .brand-name span { color: #7c3aed; }
    .brand-subtitle { margin-top: 3px; color: #7c749b; font-size: 9px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .eyebrow { color: #7c3aed; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 8px 0 6px; font-size: 27px; letter-spacing: -.04em; color: #1e1b4b; }
    .intro { margin: 0 0 24px; color: #7c749b; font-size: 13px; line-height: 1.6; }
    label { display: block; margin: 16px 0 7px; color: #2e1065; font-size: 12px; font-weight: 700; }
    input { width: 100%; border: 1px solid #ddd6fe; border-radius: 8px; padding: 11px 12px; font: inherit; font-size: 13px; color: #1e1b4b; }
    input:focus { border-color: #7c3aed; outline: 3px solid rgba(124, 58, 237, 0.15); }
    button { width: 100%; margin-top: 22px; border: 0; border-radius: 8px; background: #7c3aed; padding: 12px; color: white; cursor: pointer; font: inherit; font-size: 12px; font-weight: 800; }
    button:hover { background: #6d28d9; }
    .error { margin: 16px 0 0; border-radius: 8px; background: #fff1f0; padding: 10px 12px; color: #a12d27; font-size: 12px; }
    .footer { margin-top: 24px; color: #7c749b; font-size: 10px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/assets/logo.png" onerror="if(!this.src.endsWith('assets/logo.png'))this.src='assets/logo.png'" alt="PSM logo" class="mark" style="background:transparent; padding:0; object-fit:contain;">
      <div><div class="brand-name">Intern<span>Hub</span></div><div class="brand-subtitle">Problem Solving Minds</div></div>
    </div>
    <p class="eyebrow">Administrator access</p>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to manage intern records, portfolios, and evaluations.</p>
    <form action="/login" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" placeholder="admin@psm" maxlength="254" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" maxlength="256" required>
      <button type="submit">Sign in</button>
      <!--LOGIN_ERROR-->
    </form>
    <p class="footer">© 2026 Problem Solving Minds · InternHub</p>
  </main>
</body>
</html>
