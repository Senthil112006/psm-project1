services:
  - type: web
    name: psm-internhub
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: psm-internhub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNHUB_DATA_DIR
        value: /var/data
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
